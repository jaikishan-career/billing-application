services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: travel_invoice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d travel_invoice']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
